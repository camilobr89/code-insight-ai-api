spring:
  application:
    name: code-insight-ai-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/codeinsight}
    username: ${SPRING_DATASOURCE_USERNAME:codeinsight}
    password: ${SPRING_DATASOURCE_PASSWORD:codeinsight}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:*}
