spring:
  application:
    name: code-insight-ai-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/codeinsight}
    username: ${SPRING_DATASOURCE_USERNAME:codeinsight}
    password: ${SPRING_DATASOURCE_PASSWORD:codeinsight}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:*}
  openai:
    # Sin esta key, el análisis cae automáticamente en el modo heurístico (no rompe la app).
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5.6-luna}
  github:
    # Opcional: token de GitHub para subir el límite de la API pública (60 -> 5000 req/hora).
    token: ${GITHUB_TOKEN:}
