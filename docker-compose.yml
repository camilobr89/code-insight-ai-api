# Entorno local para probar la API + Postgres antes de hacer push.
#   OPENAI_API_KEY=sk-... docker compose up --build
# La API queda en http://localhost:8080 (health: /actuator/health).
# Sin OPENAI_API_KEY, el análisis cae automáticamente al modo heurístico (no falla).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codeinsight
      POSTGRES_USER: codeinsight
      POSTGRES_PASSWORD: codeinsight
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeinsight -d codeinsight"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/codeinsight
      SPRING_DATASOURCE_USERNAME: codeinsight
      SPRING_DATASOURCE_PASSWORD: codeinsight
      APP_CORS_ALLOWED_ORIGINS: "http://localhost:4200"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-5.6-luna}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
    ports:
      - "8080:8080"

volumes:
  pgdata:
